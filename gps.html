<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ParkEasy - Nearby Parking</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
      #map {
        height: 70vh;
        width: 100%;
      }
      .location-card {
        transition: all 0.3s ease;
      }
      .location-card:hover {
        transform: translateY(-2px);
      }
    </style>
  </head>

  <body class="bg-gray-100">
    <div class="min-h-screen">
      <header class="bg-slate-700 text-white shadow-lg">
        <div class="container mx-auto px-4 py-3">
          <h1 class="text-2xl font-bold">ParkEasy</h1>
        </div>
      </header>

      <div class="container mx-auto px-4 pb-4">
        <div class="bg-white rounded-lg shadow-lg overflow-hidden">
          <div id="map"></div>
        </div>
      </div>

      <div class="container mx-auto px-4 py-6">
        <h2 class="text-xl font-bold mb-4">Nearby Parking Locations</h2>
        <div id="parkingLocations" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
          <!-- Parking cards will be inserted here -->
        </div>
      </div>
    </div>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const parkingSpots = [
          {
            id: "kct",
            name: "Kumaraguru College of Technology",
            lat: 11.0806,
            lng: 77.0700,
            address: "Saravanampatti, Coimbatore",
            rating: 4.5
          },
          {
            id: "veerakeralam",
            name: "Veerakeralam Public Parking",
            lat: 11.0075,
            lng: 76.9215,
            address: "Veerakeralam, Coimbatore",
            rating: 4.0
          },
          {
            id: "brookefields",
            name: "Brookefields Mall Parking",
            lat: 11.0168,
            lng: 76.9558,
            address: "Brookebond Rd, Coimbatore",
            rating: 4.3
          },
          {
            id: "prozone",
            name: "Prozone Mall Parking",
            lat: 11.0567,
            lng: 77.0172,
            address: "Sathy Rd, Saravanampatti",
            rating: 4.4
          },
          {
            id: "peelamedu",
            name: "Peelamedu Public Parking",
            lat: 11.0160,
            lng: 77.0020,
            address: "Peelamedu, Coimbatore",
            rating: 4.2
          }
        ];

        function haversineDistance(coords1, coords2) {
          const toRad = (x) => (x * Math.PI) / 180;

          const lat1 = coords1.lat;
          const lon1 = coords1.lng;

          const lat2 = coords2.lat;
          const lon2 = coords2.lng;

          const R = 6371; // km
          const x1 = lat2 - lat1;
          const dLat = toRad(x1);
          const x2 = lon2 - lon1;
          const dLon = toRad(x2);
          const a =
            Math.sin(dLat / 2) * Math.sin(dLat / 2) +
            Math.cos(toRad(lat1)) *
              Math.cos(toRad(lat2)) *
              Math.sin(dLon / 2) *
              Math.sin(dLon / 2);
          const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
          const d = R * c;

          return d; // distance in km
        }

        function initMap(userLocation) {
          const map = L.map('map').setView([userLocation.lat, userLocation.lng], 14);

          L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap contributors'
          }).addTo(map);

          // Marker for User
          const userMarker = L.marker([userLocation.lat, userLocation.lng]).addTo(map);
          userMarker.bindPopup("You are here").openPopup();

          // Clean parking locations display
          const parkingLocations = document.getElementById("parkingLocations");
          parkingLocations.innerHTML = "";

          parkingSpots.forEach(spot => {
            const distance = haversineDistance(userLocation, { lat: spot.lat, lng: spot.lng });
            if (distance <= 2) { // Only show within 2 km
              const marker = L.marker([spot.lat, spot.lng]).addTo(map);
              marker.bindPopup(`<b>${spot.name}</b><br>${spot.address}<br>${distance.toFixed(2)} km away`);
              
              // Add card
              const card = document.createElement("div");
              card.className = "location-card bg-white rounded-lg shadow-md overflow-hidden";
              card.innerHTML = `
                <div class="p-4">
                  <h3 class="font-bold text-lg mb-2">${spot.name}</h3>
                  <p class="text-gray-600 text-sm mb-2">${spot.address}</p>
                  <p class="text-gray-500 text-xs mb-2">${distance.toFixed(2)} km away</p>
                  <div class="flex items-center justify-between">
                    <div class="flex items-center">
                      <span class="text-yellow-500">★</span>
                      <span class="ml-1 text-sm">${spot.rating}</span>
                    </div>
                    <button class="select-location-btn px-4 py-2 bg-slate-700 text-white rounded hover:bg-slate-800 transition-colors">
                      Select
                    </button>
                  </div>
                </div>
              `;
              card.querySelector(".select-location-btn").addEventListener("click", () => {
                sessionStorage.setItem("selected_location", JSON.stringify(spot));
                window.location.href = "parking.html";
              });
              parkingLocations.appendChild(card);
            }
          });
        }

        function locateUser() {
          if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition((position) => {
              const userLocation = {
                lat: position.coords.latitude,
                lng: position.coords.longitude
              };
              console.log("User location detected:", userLocation);
              initMap(userLocation);
            }, (error) => {
              console.error("Location error:", error.message);
              alert("Could not detect location. Showing near KCT instead.");
              const defaultLocation = { lat: 11.0806, lng: 77.0700 }; // KCT fallback
              initMap(defaultLocation);
            }, {
              enableHighAccuracy: true,
              timeout: 10000,
              maximumAge: 0
            });
          } else {
            alert("Geolocation not supported. Showing near KCT.");
            const defaultLocation = { lat: 11.0806, lng: 77.0700 };
            initMap(defaultLocation);
          }
        }

        locateUser();
      });
    </script>
  </body>
</html>
