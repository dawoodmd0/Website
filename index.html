<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ParkEasy - Smart Parking Solution</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-100">
    <div class="min-h-screen flex flex-col">
      <header class="bg-slate-700 text-white p-4">
        <div class="container mx-auto flex justify-between items-center">
          <h1 class="text-2xl font-bold">ParkEasy</h1>
          <nav>
            <button id="loginBtn" class="text-white hover:underline">
              Login
            </button>
          </nav>
        </div>
      </header>

      <main class="flex-grow container mx-auto p-4">
        <div class="max-w-md mx-auto mt-10 text-center">
          <h2 class="text-3xl font-bold mb-6">Find Parking Near You</h2>
          <p class="text-gray-600 mb-8">Quick and easy parking spot finder</p>
          <button
            id="findParkingBtn"
            class="bg-slate-700 text-white px-8 py-3 rounded-lg hover:bg-slate-800 transition-colors"
          >
            Start Finding Parking
          </button>
        </div>
      </main>

      <footer class="bg-slate-800 text-white py-4">
        <div class="container mx-auto text-center">
          <p>&copy; 2024 ParkEasy. All rights reserved.</p>
        </div>
      </footer>
    </div>

    <script>
      document
        .getElementById("findParkingBtn")
        .addEventListener("click", () => {
          window.location.href = "parking-selection.html";
        });

      document.getElementById("loginBtn").addEventListener("click", () => {
        window.location.href = "login.html";
      });
    </script>
  </body>
</html>
