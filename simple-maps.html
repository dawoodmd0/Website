<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ParkEasy - Find Parking</title>
    <!-- Replace YOUR_API_KEY with actual Google Maps API key -->
    <script src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY&libraries=places"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        #map {
            height: 400px;
            width: 100%;
            margin: 20px 0;
        }
        .location-card {
            transition: transform 0.2s;
        }
        .location-card:hover {
            transform: translateY(-2px);
        }
    </style>
</head>
<body class="bg-gray-100">
    <!-- Status Message -->
    <div id="statusMessage" class="fixed top-4 right-4 p-4 rounded-lg shadow-lg hidden"></div>

    <div class="min-h-screen">
        <!-- Header -->
        <header class="bg-slate-700 text-white p-4">
            <div class="container mx-auto">
                <h1 class="text-2xl font-bold">ParkEasy</h1>
            </div>
        </header>

        <!-- Main Content -->
        <main class="container mx-auto p-4">
            <!-- Location Controls -->
            <div class="bg-white rounded-lg shadow-md p-4 mb-4">
                <div class="flex gap-4">
                    <button id="getLocationBtn" class="bg-slate-700 text-white px-4 py-2 rounded hover:bg-slate-800">
                        Get My Location
                    </button>
                    <button id="findParkingBtn" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">
                        Find Parking Nearby
                    </button>
                </div>
                <p id="locationStatus" class="mt-2 text-gray-600"></p>
            </div>

            <!-- Map -->
            <div class="bg-white rounded-lg shadow-md overflow-hidden">
                <div id="map"></div>
            </div>

            <!-- Parking Locations -->
            <div id="parkingList" class="mt-4 grid gap-4 md:grid-cols-2 lg:grid-cols-3">
                <!-- Parking locations will be added here -->
            </div>
        </main>
    </div>

    <script>
        let map;
        let currentPosition;
        let markers = [];

        // Show status message
        function showStatus(message, type = 'info') {
            const statusDiv = document.getElementById('statusMessage');
            statusDiv.textContent = message;
            statusDiv.className = `fixed top-4 right-4 p-4 rounded-lg shadow-lg ${
                type === 'error' ? 'bg-red-100 text-red-700' : 'bg-green-100 text-green-700'
            }`;
            statusDiv.classList.remove('hidden');
            setTimeout(() => statusDiv.classList.add('hidden'), 3000);
        }

        // Initialize map
        function initMap() {
            map = new google.maps.Map(document.getElementById('map'), {
                center: { lat: -34.397, lng: 150.644 },
                zoom: 14
            });
        }

        // Get current location
        function getCurrentLocation() {
            document.getElementById('locationStatus').textContent = 'Getting your location...';

            if (!navigator.geolocation) {
                showStatus('Geolocation is not supported by your browser', 'error');
                return;
            }

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    currentPosition = {
                        lat: position.coords.latitude,
                        lng: position.coords.longitude
                    };

                    // Update map
                    map.setCenter(currentPosition);

                    // Add marker for current location
                    new google.maps.Marker({
                        position: currentPosition,
                        map: map,
                        icon: {
                            path: google.maps.SymbolPath.CIRCLE,
                            scale: 10,
                            fillColor: '#4285F4',
                            fillOpacity: 1,
                            strokeColor: '#FFFFFF',
                            strokeWeight: 2
                        },
                        title: 'Your Location'
                    });

                    document.getElementById('locationStatus').textContent =
                        'Location found! Click "Find Parking Nearby" to see available spots.';
                    showStatus('Location successfully found!');
                },
                (error) => {
                    let errorMessage = 'Error getting your location: ';
                    switch(error.code) {
                        case error.PERMISSION_DENIED:
                            errorMessage += 'Permission denied. Please enable location services.';
                            break;
                        case error.POSITION_UNAVAILABLE:
                            errorMessage += 'Position unavailable.';
                            break;
                        case error.TIMEOUT:
                            errorMessage += 'Request timed out.';
                            break;
                        default:
                            errorMessage += 'Unknown error occurred.';
                    }
                    document.getElementById('locationStatus').textContent = errorMessage;
                    showStatus(errorMessage, 'error');
                }
            );
        }

        // Find parking spots
        function findParking() {
            if (!currentPosition) {
                showStatus('Please get your location first', 'error');
                return;
            }

            // Clear existing markers
            markers.forEach(marker => marker.setMap(null));
            markers = [];
            document.getElementById('parkingList').innerHTML = '';

            const service = new google.maps.places.PlacesService(map);
            service.nearbySearch(
                {
                    location: currentPosition,
                    radius: 1500,
                    type: ['parking']
                },
                (results, status) => {
                    if (status === google.maps.places.PlacesServiceStatus.OK) {
                        results.forEach(place => {
                            // Add marker
                            const marker = new google.maps.Marker({
                                position: place.geometry.location,
                                map: map,
                                title: place.name
                            });
                            markers.push(marker);

                            // Add info window
                            const infoWindow = new google.maps.InfoWindow({
                                content: `
                                    <div>
                                        <h3 class="font-bold">${place.name}</h3>
                                        <p>${place.vicinity}</p>
                                        ${place.rating ? `
                                            <p>Rating: ${place.rating} ⭐</p>
                                        ` : ''}
                                    </div>
                                `
                            });

                            marker.addListener('click', () => {
                                infoWindow.open(map, marker);
                            });

                            // Add to list
                            const card = document.createElement('div');
                            card.className = 'location-card bg-white rounded-lg shadow-md p-4';
                            card.innerHTML = `
                                <h3 class="font-bold text-lg">${place.name}</h3>
                                <p class="text-gray-600">${place.vicinity}</p>
                                ${place.rating ? `
                                    <p class="text-yellow-500 mt-2">Rating: ${place.rating} ⭐</p>
                                ` : ''}
                                <button class="mt-3 bg-slate-700 text-white px-4 py-2 rounded hover:bg-slate-800 w-full">
                                    Select This Spot
                                </button>
                            `;

                            card.querySelector('button').addEventListener('click', () => {
                                // Store selected location
                                sessionStorage.setItem('selected_location', JSON.stringify({
                                    name: place.name,
                                    address: place.vicinity,
                                    lat: place.geometry.location.lat(),
                                    lng: place.geometry.location.lng(),
                                    rating: place.rating
                                }));
                                window.location.href = 'parking.html';
                            });

                            document.getElementById('parkingList').appendChild(card);
                        });

                        showStatus(`Found ${results.length} parking locations nearby`);
                    } else {
                        showStatus('Error finding parking locations', 'error');
                    }
                }
            );
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            initMap();

            document.getElementById('getLocationBtn').addEventListener('click', getCurrentLocation);
            document.getElementById('findParkingBtn').addEventListener('click', findParking);
        });
    </script>
</body>
</html>
