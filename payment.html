<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ParkEasy - Payment</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="bg-neutral-100 min-h-screen">
    <header class="bg-slate-700 text-white py-4">
      <div class="container mx-auto px-4 flex justify-between items-center">
        <h1 class="text-2xl font-bold">ParkEasy</h1>
        <nav>
          <button id="logout" class="text-sm hover:underline">Logout</button>
        </nav>
      </div>
    </header>

    <main class="container mx-auto px-4 py-8">
      <div class="max-w-2xl mx-auto">
        <div class="bg-white rounded-lg shadow-xl p-6">
          <h2 class="text-2xl font-semibold mb-6">Payment Details</h2>

          <div class="mb-8">
            <h3 class="font-semibold mb-4">Booking Summary</h3>
            <div class="bg-gray-50 p-4 rounded-lg">
              <div class="grid grid-cols-2 gap-4 text-sm">
                <p class="text-gray-600">Location:</p>
                <p id="summaryLocation" class="font-medium">Downtown Parking</p>

                <p class="text-gray-600">Slot Type:</p>
                <p id="summarySlotType" class="font-medium">VIP</p>

                <p class="text-gray-600">Duration:</p>
                <p id="summaryDuration" class="font-medium">2 hours</p>

                <p class="text-gray-600">Rate:</p>
                <p id="summaryRate" class="font-medium">$20/hr</p>

                <p class="text-gray-600">Total Amount:</p>
                <p id="summaryTotal" class="font-medium">$40.00</p>
              </div>
            </div>
          </div>

          <form id="paymentForm" class="space-y-6">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">
                Card Number
              </label>
              <input
                type="text"
                class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-slate-500"
                placeholder="1234 5678 9012"
                required
              />
            </div>

            <div class="grid grid-cols-2 gap-4">
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">
                  Expiry Date
                </label>
                <input
                  type="text"
                  class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-slate-500"
                  placeholder="MM/YY"
                  required
                />
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">
                  CVV
                </label>
                <input
                  type="text"
                  class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-slate-500"
                  placeholder="123"
                  required
                />
              </div>
            </div>

            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">
                Cardholder Name
              </label>
              <input
                type="text"
                class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-slate-500"
                placeholder="John Doe"
                required
              />
            </div>

            <button
              type="submit"
              class="w-full py-3 px-4 bg-slate-700 text-white rounded-md hover:bg-slate-800 focus:outline-none focus:ring-2 focus:ring-slate-500 focus:ring-offset-2"
            >
              Pay Now
            </button>
          </form>
        </div>
      </div>
    </main>

    <div
      id="processingOverlay"
      class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center"
    >
      <div class="bg-white p-6 rounded-lg">
        <div
          class="animate-spin rounded-full h-12 w-12 border-b-2 border-slate-700 mx-auto"
        ></div>
        <p class="mt-4 text-center">Processing payment...</p>
      </div>
    </div>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const cardNumberInput = document.querySelector('input[placeholder="1234 5678 9012"]');
        const paymentForm = document.getElementById("paymentForm");

        // Format card number input
        cardNumberInput.addEventListener("input", (e) => {
          let value = e.target.value.replace(/\D/g, ""); // Remove all non-digit characters
          value = value.substring(0, 12); // Limit to 12 digits
          const formattedValue = value.replace(/(\d{4})(?=\d)/g, "$1 "); // Add space after every 4 digits
          e.target.value = formattedValue;
        });

        // Prevent invalid characters
        cardNumberInput.addEventListener("keypress", (e) => {
          if (!/\d/.test(e.key)) {
            e.preventDefault(); // Allow only digits
          }
        });

        // Handle form submission
        paymentForm.addEventListener("submit", (e) => {
          e.preventDefault(); // Prevent default form submission

          // Show processing overlay (optional)
          const processingOverlay = document.getElementById("processingOverlay");
          processingOverlay.classList.remove("hidden");

          // Simulate payment processing delay
          setTimeout(() => {
            // Redirect to confirmation.html
            window.location.href = "confirmation.html";
          }, 2000); // 2-second delay for simulation
        });
      });
    </script>
  </body>
</html>
