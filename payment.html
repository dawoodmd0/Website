<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ParkEasy - Payment</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="bg-neutral-100 min-h-screen">

<header class="bg-slate-700 text-white py-4">
  <div class="container mx-auto px-4 flex justify-between items-center">
    <h1 class="text-2xl font-bold">ParkEasy</h1>
    <nav>
      <button id="logout" class="text-sm hover:underline">Logout</button>
    </nav>
  </div>
</header>

<main class="container mx-auto px-4 py-8">
  <div class="max-w-2xl mx-auto">
    <div class="bg-white rounded-lg shadow-xl p-6">
      <h2 class="text-2xl font-semibold mb-6">Payment Details</h2>

      <div class="mb-8">
        <h3 class="font-semibold mb-4">Booking Summary</h3>
        <div class="bg-gray-50 p-4 rounded-lg">
          <div class="grid grid-cols-2 gap-4 text-sm">
            <p class="text-gray-600">Location:</p>
            <p id="summaryLocation" class="font-medium">Downtown Parking</p>

            <p class="text-gray-600">Slot Type:</p>
            <p id="summarySlotType" class="font-medium"></p>

            <p class="text-gray-600">Time Slot:</p>
            <p id="summaryDuration" class="font-medium"></p>

            <p class="text-gray-600">Rate:</p>
            <p id="summaryRate" class="font-medium"></p>

            <p class="text-gray-600">Total Amount:</p>
            <p id="summaryTotal" class="font-medium"></p>
          </div>
        </div>
      </div>

      <form id="paymentForm" class="space-y-6">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Card Number</label>
          <input id="cardNumber" type="text" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-slate-500" placeholder="1234 5678 9012" required />
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Expiry Date</label>
            <input id="expiryDate" type="text" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-slate-500" placeholder="MM/YY" required />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">CVV</label>
            <input id="cvv" type="text" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-slate-500" placeholder="123" required />
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Cardholder Name</label>
          <input id="cardholderName" type="text" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-slate-500" placeholder="John Doe" required />
        </div>

        <button type="submit" class="w-full py-3 px-4 bg-slate-700 text-white rounded-md hover:bg-slate-800 focus:outline-none focus:ring-2 focus:ring-slate-500 focus:ring-offset-2">
          Pay Now
        </button>
      </form>
    </div>
  </div>
</main>

<div id="processingOverlay" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center">
  <div class="bg-white p-6 rounded-lg">
    <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-slate-700 mx-auto"></div>
    <p class="mt-4 text-center">Processing payment...</p>
  </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const selectedVehicle = localStorage.getItem('selectedVehicle');
  const selectedSlot = localStorage.getItem('selectedSlot');
  const selectedTime = localStorage.getItem('selectedTime');

  const rates = {
    car: { vip: 1000, premium: 700, normal: 300 },
    bike: { vip: 500, premium: 350, normal: 150 },
    others: { vip: 800, premium: 600, normal: 250 }
  };

  const rate = rates[selectedVehicle]?.[selectedSlot] || 0;
  const totalAmount = rate;

  document.getElementById('summarySlotType').textContent = `${selectedSlot?.toUpperCase()} Parking (${selectedVehicle?.toUpperCase()})`;
  document.getElementById('summaryDuration').textContent = selectedTime || 'Not Selected';
  document.getElementById('summaryRate').textContent = `₹${rate}`;
  document.getElementById('summaryTotal').textContent = `₹${totalAmount}`;

  const paymentForm = document.getElementById("paymentForm");
  paymentForm.addEventListener("submit", (e) => {
    e.preventDefault();

    const cardholderName = document.getElementById('cardholderName').value;
    const transactionTime = new Date().toLocaleString();

    localStorage.setItem('cardholderName', cardholderName);
    localStorage.setItem('amountPaid', totalAmount);
    localStorage.setItem('transactionTime', transactionTime);

    document.getElementById("processingOverlay").classList.remove("hidden");

    setTimeout(() => {
      window.location.href = "confirmation.html";
    }, 2000);
  });
});
</script>

</body>
</html>
